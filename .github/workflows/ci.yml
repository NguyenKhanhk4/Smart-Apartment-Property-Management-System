# CI: mỗi PR và mỗi lần push lên main phải qua lint + test (server, client) + build client.
# Test server dùng MongoDB trong RAM (mongodb-memory-server) — không cần secret, không đụng DB thật.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Binary mongod của mongodb-memory-server (~100MB) — cache để không tải lại mỗi lần
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm test

  client:
    name: Client — lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Không dùng `npm ci`: npm 11 tự sinh lockfile mà chính `npm ci` lại báo thiếu @emnapi/wasi-threads
      # (dependency đóng gói sẵn của @tailwindcss/oxide-wasm32-wasi). `npm install` vẫn cài đúng phiên bản trong lockfile.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Test đối chiếu enum server ↔ client nằm ở server/test/constants/enumParity.test.js (chạy trong job server)
